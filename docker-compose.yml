services:
  itinerary-web:
    image: nginx:alpine
    container_name: disney_itinerary
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site-content:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - disney-api

  disney-api:
    build: ./disney-api
    container_name: disney_api
    restart: unless-stopped
    volumes:
      - disney-db:/data
      - /mnt/motherbrain/ironwolf_01/disney-site/storage:/storage
    expose:
      - "3001"

volumes:
  disney-db: