  <style>
    /* ============================================================
       PRE-TRIP DASHBOARD — TV-inspired prep mode
       ============================================================ */

    body.page-pretrip {
      background: linear-gradient(135deg, #0f1930 0%, #1a2e5a 50%, #0d3a6e 100%);
      color: white;
    }

    body.page-pretrip::before { opacity: 0.03; }

    /* Desktop: two-column layout with nav on left */
    .pretrip-layout {
      display: flex;
      gap: 2rem;
      min-height: calc(100vh - 4rem);
    }

    /* Left nav column — desktop only */
    .pretrip-nav-column {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      width: 160px;
      flex-shrink: 0;
      padding-top: 1rem;
    }

    @media (min-width: 900px) {
      .pretrip-nav-column { display: flex; }
    }

    .pretrip-nav-column .nav-link {
      min-width: unset;
      width: 100%;
      height: 52px;
      padding: 0 0.75rem;
    }

    /* Main content area */
    .pretrip-main {
      flex: 1;
      min-width: 0;
    }

    /* ── Countdown Hero ── */
    .pretrip-countdown-hero {
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .pretrip-countdown-label {
      font-family: 'Nunito', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 0.5rem;
    }

    .pretrip-countdown-number {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 8rem;
      color: var(--pixie-gold);
      line-height: 1;
      text-shadow: 0 0 40px rgba(255, 199, 44, 0.3), 0 4px 20px rgba(0, 0, 0, 0.3);
      margin: 0;
    }

    .pretrip-countdown-unit {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.06em;
      margin-top: -0.5rem;
    }

    .pretrip-trip-name {
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.75rem;
    }

    .pretrip-trip-dates {
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
    }

    /* Shimmer on the countdown */
    .pretrip-countdown-hero::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      animation: shimmer 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0%   { left: -60%; }
      40%  { left: 120%; }
      100% { left: 120%; }
    }

    /* ── Card Grid ── */
    .pretrip-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 700px) {
      .pretrip-cards { grid-template-columns: 1fr; }
    }

    /* ── Glass Card ── */
    .pretrip-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pretrip-card-label {
      font-family: 'Nunito', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
      margin: 0 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ── Steps Card ── */
    .steps-target-number {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 3.5rem;
      color: var(--pixie-gold);
      line-height: 1;
      margin: 0 0 0.25rem;
    }

    .steps-target-unit {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      margin: 0 0 1rem;
    }

    .steps-explanation {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
      margin: 0 0 1.25rem;
    }

    .steps-range-bar {
      position: relative;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }

    .steps-range-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
      transition: width 0.5s ease;
    }

    .steps-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 1.25rem;
    }

    .steps-log-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .steps-log-form input {
      flex: 1;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
    }

    .steps-log-form input::placeholder { color: rgba(255, 255, 255, 0.35); }

    .steps-log-form input:focus {
      outline: none;
      border-color: rgba(255, 199, 44, 0.5);
      background: rgba(255, 255, 255, 0.1);
    }

    .steps-logged-note {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
    }

    /* ── Budget Card ── */
    .budget-saved-number {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 3rem;
      color: white;
      line-height: 1;
      margin: 0;
    }

    .budget-goal-text {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      margin: 0.25rem 0 1rem;
    }

    .budget-progress-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .budget-progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--castle-blue), var(--sky-blue), var(--pixie-gold));
      transition: width 0.5s ease;
    }

    .budget-progress-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      margin: 0 0 1rem;
    }

    .budget-pace-status {
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 0.5rem 0.85rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .budget-pace-status.on-track {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .budget-pace-status.behind {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .budget-pace-status.ahead {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .budget-pace-status.complete {
      background: rgba(255, 199, 44, 0.15);
      color: var(--pixie-gold);
      border: 1px solid rgba(255, 199, 44, 0.3);
    }

    /* Add contribution form */
    .contrib-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .contrib-form input {
      flex: 1;
      min-width: 100px;
      padding: 0.55rem 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .contrib-form input::placeholder { color: rgba(255, 255, 255, 0.3); }

    .contrib-form input:focus {
      outline: none;
      border-color: var(--pixie-gold);
      box-shadow: 0 0 0 2px rgba(255, 199, 44, 0.2);
    }

    .contrib-btn {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--castle-blue), #1e40af);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .contrib-btn:hover { box-shadow: 0 4px 14px rgba(0, 48, 135, 0.4); }
    .contrib-btn:active { transform: scale(0.97); }

    /* Recent contributions list */
    .contrib-list {
      max-height: 160px;
      overflow-y: auto;
    }

    .contrib-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
    }

    .contrib-item:last-child { border-bottom: none; }

    .contrib-item-info {
      color: rgba(255, 255, 255, 0.6);
    }

    .contrib-item-amount {
      font-weight: 800;
      color: #4ade80;
    }

    .contrib-item-delete {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      margin-left: 0.5rem;
    }

    .contrib-item-delete:hover {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }

    /* ── No Budget State ── */
    .no-budget-state {
      text-align: center;
      padding: 1rem 0;
    }

    .no-budget-state p {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
      margin: 0 0 1rem;
    }

    /* ── No Trip State ── */
    .pretrip-empty {
      text-align: center;
      padding: 4rem 2rem;
    }

    .pretrip-empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .pretrip-empty h2 {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 2rem;
      color: var(--pixie-gold);
      margin: 0 0 0.5rem;
    }

    .pretrip-empty p {
      color: rgba(255, 255, 255, 0.5);
      max-width: 400px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
    }

    /* ── Quick Links Row ── */
    .pretrip-links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .pretrip-link {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .pretrip-link:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: white;
    }

    /* ── Window Alert Banners (60-day dining, 7-day LL) ── */
    .pretrip-alerts {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .pretrip-alert {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 199, 44, 0.14), rgba(255, 199, 44, 0.06));
      border: 1px solid rgba(255, 199, 44, 0.35);
      box-shadow: 0 4px 20px rgba(255, 199, 44, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pretrip-alert.lightning {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.18), rgba(59, 130, 246, 0.08));
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12);
    }

    .pretrip-alert-icon {
      font-size: 2rem;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
    }

    .pretrip-alert-body {
      flex: 1;
      min-width: 0;
    }

    .pretrip-alert-title {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 1.25rem;
      color: var(--pixie-gold);
      letter-spacing: 0.03em;
      margin: 0 0 0.15rem;
    }

    .pretrip-alert.lightning .pretrip-alert-title {
      color: #93c5fd;
    }

    .pretrip-alert-text {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.4;
      margin: 0 0 0.65rem;
    }

    .pretrip-alert-cta {
      display: inline-block;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      background: var(--pixie-gold);
      color: var(--castle-blue);
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.15s;
    }

    .pretrip-alert-cta:hover {
      box-shadow: 0 4px 14px rgba(255, 199, 44, 0.4);
    }

    .pretrip-alert-cta:active { transform: scale(0.97); }

    .pretrip-alert.lightning .pretrip-alert-cta {
      background: #60a5fa;
      color: #0f1930;
    }

    .pretrip-alert.lightning .pretrip-alert-cta:hover {
      box-shadow: 0 4px 14px rgba(96, 165, 250, 0.45);
    }

    .pretrip-alert-dismiss {
      position: absolute;
      top: 0.5rem;
      right: 0.65rem;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .pretrip-alert-dismiss:hover {
      background: rgba(255, 255, 255, 0.18);
      color: white;
    }

    @media (max-width: 520px) {
      .pretrip-alert { padding: 0.85rem 1rem; gap: 0.75rem; }
      .pretrip-alert-icon { font-size: 1.6rem; }
      .pretrip-alert-title { font-size: 1.1rem; }
      .pretrip-alert-text { font-size: 0.8rem; }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .pretrip-countdown-number { font-size: 5.5rem; }
      .pretrip-countdown-unit { font-size: 1.8rem; }
      .steps-target-number { font-size: 2.8rem; }
      .budget-saved-number { font-size: 2.5rem; }
      .pretrip-card { padding: 1.25rem; }
    }
  </style>

  <script>
  // ============================================================
  // PRE-TRIP DASHBOARD
  // ============================================================

  // Steps formula: ramps from 10k (90+ days) to 20k (7 days)
  function getStepTarget(daysAway) {
    if (daysAway >= 90) return 10000;
    if (daysAway <= 7)  return 20000;
    // Linear ramp: 10k at 90 days → 20k at 7 days
    const progress = (90 - daysAway) / (90 - 7); // 0 at 90 days, 1 at 7 days
    return Math.round((10000 + progress * 10000) / 500) * 500; // Round to nearest 500
  }

  function getStepExplanation(daysAway, target) {
    if (daysAway >= 60) return `With ${daysAway} days to go, focus on building a walking habit. ${target.toLocaleString()} steps is a comfortable baseline.`;
    if (daysAway >= 30) return `You're a month out! Time to ramp up. ${target.toLocaleString()} steps daily will get your legs ready for park days.`;
    if (daysAway >= 14) return `Two weeks out — this is crunch time. ${target.toLocaleString()} steps will prep you for 10+ mile park days.`;
    return `Almost there! ${target.toLocaleString()} steps mirrors what you'll actually walk at Disney. Your feet will thank you.`;
  }

  // Step target as a percentage of the bar (10k = 0%, 20k = 100%)
  function getStepBarPercent(target) {
    return Math.round(((target - 10000) / 10000) * 100);
  }

  function formatMoney(n) {
    return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  async function loadPretrip() {
    const main = document.getElementById("pretrip-main");
    const navCol = document.getElementById("pretrip-nav-column");

    // Populate desktop nav column with ticket links (clone from tray)
    const trayLinks = document.querySelectorAll(".nav-ticket-tray .nav-link");
    if (navCol) {
      navCol.innerHTML = "";
      trayLinks.forEach(link => {
        navCol.appendChild(link.cloneNode(true));
      });
    }

    // Find the next upcoming trip from trip_budgets (single source of truth)
    const todayStr = getTodayString();
    let allTrips = [];
    try { allTrips = await apiFetch("/trip-budgets"); } catch (e) { }

    // If the user is currently on an active trip, the pre-trip view doesn't apply —
    // send them to the Dashboard instead. Mirrors the membership filter in dashboard.js
    // so admins and trip members agree on what counts as "their" active trip.
    const user = (typeof Auth !== "undefined") ? Auth.getUser() : null;
    let myTrips = allTrips;
    if (user && user.role !== "admin") {
      try {
        const memberTrips = await apiFetch(`/users/${user.id}/trips`);
        const memberTripIds = new Set(memberTrips.map(t => t.trip_id));
        myTrips = allTrips.filter(t => memberTripIds.has(t.trip_id));
      } catch (e) { }
    }
    const activeTrip = myTrips.find(t => todayStr >= t.start_date && todayStr <= t.end_date);
    if (activeTrip) {
      // #stay guards against any chance of dashboard.js bouncing back to pretrip
      window.location.replace("index.html#stay");
      return;
    }

    // Find the next upcoming trip
    const upcomingTrips = allTrips
      .filter(t => t.start_date > todayStr)
      .sort((a, b) => a.start_date.localeCompare(b.start_date));

    const nextTripBudget = upcomingTrips[0];

    if (!nextTripBudget) {
      main.innerHTML = `
        <div class="pretrip-empty">
          <div class="pretrip-empty-icon">✨</div>
          <h2>No Upcoming Trips</h2>
          <p>Plan your next Disney adventure and come back here to track your prep!</p>
          <a href="planner.html" class="primary-button" style="display:inline-block; text-decoration:none;">Plan a Trip ✨</a>
        </div>
      `;
      return;
    }

    const startDate = nextTripBudget.start_date;
    const endDate = nextTripBudget.end_date;
    const tripId = nextTripBudget.trip_id;
    _pretripTripId = tripId; // Set globally for packing/contribution functions

    // Calculate days away
    const [sy, sm, sd] = startDate.split("-").map(Number);
    const tripStart = new Date(sy, sm - 1, sd);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const daysAway = Math.ceil((tripStart - today) / (1000 * 60 * 60 * 24));

    // Format dates
    const startFmt = tripStart.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const [ey, em, ed] = endDate.split("-").map(Number);
    const endFmt = new Date(ey, em - 1, ed).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const dayCount = Math.round((new Date(ey, em - 1, ed) - tripStart) / (1000 * 60 * 60 * 24)) + 1;

    // Steps
    const stepTarget = getStepTarget(daysAway);
    const stepExplanation = getStepExplanation(daysAway, stepTarget);
    const stepBarPct = getStepBarPercent(stepTarget);

    // Budget — find trip budget
    let tripBudget = null;
    try {
      const budgets = await apiFetch("/trip-budgets");
      tripBudget = budgets.find(b => b.trip_id === tripId);
    } catch (e) { }

    const totalBudget = tripBudget ? (tripBudget.hotel + tripBudget.food + tripBudget.extras + tripBudget.souvenirs) : 0;

    // Get contributions (my-contributions returns { contributions, totalContributed })
    let contributions = [];
    let totalSaved = 0;
    try {
      const contribData = await apiFetch(`/trips/${tripId}/my-contributions`);
      contributions = contribData.contributions || [];
      totalSaved = contribData.totalContributed || 0;
    } catch (e) { }

    // Steps logged today for current user
    const currentUser = Auth.getUser();
    const todayIsoStr = new Date().toISOString().split("T")[0];
    let todayStepsLogged = null;
    try {
      const stepRows = await apiFetch(`/trips/${tripId}/steps?date=${todayIsoStr}`);
      const mine = (stepRows || []).find(r => r.user_id === (currentUser ? currentUser.id : ""));
      if (mine) todayStepsLogged = mine.steps;
    } catch (e) { }
    const pctSaved = totalBudget > 0 ? Math.min((totalSaved / totalBudget) * 100, 100) : 0;

    // Pace calculation
    let paceHtml = "";
    if (totalBudget > 0) {
      const remaining = totalBudget - totalSaved;
      if (remaining <= 0) {
        paceHtml = `<div class="budget-pace-status complete">🎉 Fully funded! You're all set.</div>`;
      } else {
        const perDay = remaining / Math.max(daysAway, 1);
        if (perDay <= (totalBudget / 90)) {
          paceHtml = `<div class="budget-pace-status on-track">✅ On track — ${formatMoney(perDay)}/day to reach your goal</div>`;
        } else if (perDay <= (totalBudget / 30)) {
          paceHtml = `<div class="budget-pace-status behind">⚠️ A bit behind — need ${formatMoney(perDay)}/day to catch up</div>`;
        } else {
          paceHtml = `<div class="budget-pace-status behind">🚨 ${formatMoney(remaining)} still needed — ${formatMoney(perDay)}/day</div>`;
        }
      }
    }

    // Recent contributions list
    const recentContribsHtml = contributions.slice(0, 8).map(c => {
      const dateFmt = c.date ? new Date(c.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
      return `
        <div class="contrib-item">
          <span class="contrib-item-info">${dateFmt}${c.note ? " — " + escapeHtml(c.note) : ""}${c.contributed_by_name ? " · " + escapeHtml(c.contributed_by_name) : ""}</span>
          <span>
            <span class="contrib-item-amount">+${formatMoney(c.amount)}</span>
            <button class="contrib-item-delete" onclick="deleteContribution('${c.id}')" title="Remove">✕</button>
          </span>
        </div>
      `;
    }).join("");

    // Budget card content
    let budgetCardBody = "";
    if (totalBudget > 0) {
      budgetCardBody = `
        <div class="budget-saved-number">${formatMoney(totalSaved)}</div>
        <div class="budget-goal-text">saved of ${formatMoney(totalBudget)} goal</div>
        <div class="budget-progress-track">
          <div class="budget-progress-bar" style="width:${pctSaved}%"></div>
        </div>
        <div class="budget-progress-label">${Math.round(pctSaved)}% funded</div>
        ${paceHtml}
        <div class="contrib-form" id="contrib-form">
          <input type="number" id="contrib-amount" placeholder="Amount ($)" step="0.01" min="0.01" />
          <input type="text" id="contrib-note" placeholder="Note (optional)" />
          <button class="contrib-btn" onclick="addContribution()">+ Add</button>
        </div>
        ${recentContribsHtml ? `<div class="contrib-list">${recentContribsHtml}</div>` : ""}
      `;
    } else {
      budgetCardBody = `
        <div class="no-budget-state">
          <p>No budget set for this trip yet.</p>
          <a href="budget.html" class="primary-button small-button" style="text-decoration:none; display:inline-block;">Set Trip Budget</a>
        </div>
      `;
    }

    // ── Countdown Alerts (on-property only) ─────────────────
    let alertsHtml = "";
    const isOnProperty = (nextTripBudget.resort_type || "disney") === "disney";
    if (isOnProperty && daysAway > 0) {
      let dismissed = [];
      try {
        const res = await apiFetch(`/trips/${tripId}/alert-dismissals`);
        dismissed = res.dismissed || [];
      } catch (e) { /* not logged in or endpoint missing — skip */ }

      const banners = [];

      // 60-day dining window — show from 60 days down to 8 days (LL takes over at 7)
      if (daysAway <= 60 && daysAway > 7 && !dismissed.includes("dining_60d")) {
        banners.push(`
          <div class="pretrip-alert" data-alert-key="dining_60d">
            <button class="pretrip-alert-dismiss" aria-label="Dismiss">✕</button>
            <span class="pretrip-alert-icon">🍽️</span>
            <div class="pretrip-alert-body">
              <h3 class="pretrip-alert-title">Dining Reservations Are Open</h3>
              <p class="pretrip-alert-text">You're ${daysAway} days out — as a Disney Resort guest, you can book dining for your whole stay right now. Popular spots fill up fast!</p>
              <a class="pretrip-alert-cta" href="https://disneyworld.disney.go.com/dining/" target="_blank" rel="noopener">Book Dining →</a>
            </div>
          </div>
        `);
      }

      // 7-day Lightning Lane window
      if (daysAway <= 7 && daysAway > 0 && !dismissed.includes("lightning_lane_7d")) {
        banners.push(`
          <div class="pretrip-alert lightning" data-alert-key="lightning_lane_7d">
            <button class="pretrip-alert-dismiss" aria-label="Dismiss">✕</button>
            <span class="pretrip-alert-icon">⚡</span>
            <div class="pretrip-alert-body">
              <h3 class="pretrip-alert-title">Lightning Lane Is Available</h3>
              <p class="pretrip-alert-text">You're ${daysAway} day${daysAway !== 1 ? "s" : ""} out — Disney Resort guests can purchase Lightning Lane Multi Pass for your whole stay now.</p>
              <a class="pretrip-alert-cta" href="https://disneyworld.disney.go.com/lightning-lane/" target="_blank" rel="noopener">Buy Lightning Lane →</a>
            </div>
          </div>
        `);
      }

      if (banners.length) {
        alertsHtml = `<div class="pretrip-alerts">${banners.join("")}</div>`;
      }
    }

    main.innerHTML = `
      ${alertsHtml}
      <!-- Countdown Hero -->
      <div class="pretrip-countdown-hero">
        <div class="pretrip-countdown-label">Your Next Disney Trip</div>
        <div class="pretrip-countdown-number">${daysAway}</div>
        <div class="pretrip-countdown-unit">day${daysAway !== 1 ? "s" : ""} away</div>
        <div class="pretrip-trip-name">${startFmt} – ${endFmt} · ${dayCount} day${dayCount !== 1 ? "s" : ""}</div>
      </div>

      <!-- Quick Links -->
      <div class="pretrip-links">
        <a href="itinerary.html" class="pretrip-link">📋 Itinerary</a>
        <a href="wishlist.html" class="pretrip-link">⭐ Wishlist</a>
        <a href="planner.html" class="pretrip-link">🗺️ Planner</a>
        <a href="history.html" class="pretrip-link">📖 Past Trips</a>
      </div>

      <!-- Cards -->
      <div class="pretrip-cards">
        <!-- Steps Card -->
        <div class="pretrip-card">
          <div class="pretrip-card-label">👟 Step Training</div>
          <div class="steps-target-number">${stepTarget.toLocaleString()}</div>
          <div class="steps-target-unit">steps per day target</div>
          <div class="steps-range-bar">
            <div class="steps-range-fill" style="width:${stepBarPct}%"></div>
          </div>
          <div class="steps-range-labels">
            <span>10k (baseline)</span>
            <span>20k (park-ready)</span>
          </div>
          <div class="steps-explanation">${stepExplanation}</div>
          <div class="steps-log-form">
            <input type="number" id="steps-input" inputmode="numeric" min="0" step="1" placeholder="${todayStepsLogged !== null ? todayStepsLogged.toLocaleString() : "Steps today"}" />
            <button class="contrib-btn" onclick="logSteps()">${todayStepsLogged !== null ? "Update" : "Log"}</button>
          </div>
          ${todayStepsLogged !== null
            ? `<div class="steps-logged-note">Logged today: <strong>${todayStepsLogged.toLocaleString()}</strong> steps</div>`
            : `<div class="steps-logged-note" style="opacity:0.5;">No steps logged yet today</div>`}
        </div>

        <!-- Budget Card -->
        <div class="pretrip-card">
          <div class="pretrip-card-label">💰 Trip Fund</div>
          ${budgetCardBody}
        </div>

        <!-- Flight Card — dynamically populated -->
        <div class="pretrip-card" id="flight-card">
          <div class="pretrip-card-label">✈️ Flights</div>
          <div id="flight-card-body">
            <p style="color:rgba(255,255,255,0.4); font-size:0.85rem; margin:0;">Loading...</p>
          </div>
        </div>

        <!-- Packing List Card -->
        <div class="pretrip-card" id="packing-card">
          <div class="pretrip-card-label">🧳 Packing List</div>
          <div id="packing-list-content" style="min-height:60px;">
            <p style="color:rgba(255,255,255,0.4); font-size:0.85rem; margin:0 0 0.75rem;">Loading...</p>
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
            <input type="text" id="packing-new-item" placeholder="Add item..." style="flex:1; padding:0.5rem 0.75rem; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.07); color:white; font-family:'Nunito',sans-serif; font-size:0.88rem;" />
            <button onclick="addPackingItem()" style="padding:0.5rem 0.85rem; border-radius:10px; border:none; background:var(--castle-blue); color:white; font-family:'Nunito',sans-serif; font-size:0.85rem; font-weight:800; cursor:pointer;">+ Add</button>
          </div>
        </div>

      </div>
    `;

    // Load dynamic card content after DOM is set
    loadFlightCard();
    loadPackingList();
    wireAlertDismissals(tripId);
  }

  // ── Countdown alert dismissals ─────────────────────────────
  function wireAlertDismissals(tripId) {
    document.querySelectorAll(".pretrip-alert").forEach(alertEl => {
      const dismissBtn = alertEl.querySelector(".pretrip-alert-dismiss");
      if (!dismissBtn) return;
      dismissBtn.addEventListener("click", async () => {
        const key = alertEl.dataset.alertKey;
        alertEl.style.transition = "opacity 0.2s, transform 0.2s";
        alertEl.style.opacity = "0";
        alertEl.style.transform = "scale(0.96)";
        try {
          await apiFetch(`/trips/${tripId}/alert-dismissals`, {
            method: "POST",
            body: JSON.stringify({ alert_key: key }),
          });
        } catch (e) { /* will reappear next load; silent */ }
        setTimeout(() => alertEl.remove(), 220);
      });
    });
  }

  // ── Flight Deep-Link Builder ────────────────────────────────
  // Builds a Google Flights URL pre-populated with MCO and trip dates.
  // No API key required — pure URL construction.
  function buildFlightUrl(origin, dest, depDate, retDate, adults = "1", isReturn = false) {
    const dep = isReturn ? retDate : depDate;
    const ret = isReturn ? "" : retDate;
    // Google Flights explore URL — works without knowing origin
    const base = "https://www.google.com/travel/flights";
    const params = new URLSearchParams({
      q: isReturn
        ? `Flights from ${dest} to home on ${ret}`
        : `Flights to ${dest} from ${dep} to ${ret}`,
    });
    // Structured deep-link format
    const tfs = isReturn
      ? `CAEQAhooEgoyMDI2LTA1LTA3agcIARIDTUNPcgcIARIDTUNP`
      : "";
    return `${base}?${params.toString()}`;
  }

  // ── Flight Card Logic ─────────────────────────────────────
  async function loadFlightCard() {
    const body = document.getElementById("flight-card-body");
    if (!body || !_pretripTripId) return;

    let flights = [];
    try { flights = await apiFetch(`/trips/${_pretripTripId}/flights`); } catch (e) { }

    const outbound = flights.find(f => f.direction === "outbound");
    const returnFl = flights.find(f => f.direction === "return");

    // Get trip dates for Google Flights links
    let startDate = "", endDate = "", startFmt = "", endFmt = "";
    try {
      const allTrips = await apiFetch("/trip-budgets");
      const trip = allTrips.find(t => t.trip_id === _pretripTripId);
      if (trip) {
        startDate = trip.start_date;
        endDate = trip.end_date;
        const [sy,sm,sd] = startDate.split("-").map(Number);
        const [ey,em,ed] = endDate.split("-").map(Number);
        startFmt = new Date(sy, sm-1, sd).toLocaleDateString("en-US", { month:"short", day:"numeric" });
        endFmt = new Date(ey, em-1, ed).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
      }
    } catch (e) { }

    let html = "";

    // Outbound section
    html += renderFlightSection("outbound", "Outbound Flight", outbound, startDate, endDate, startFmt, endFmt);
    // Return section
    html += renderFlightSection("return", "Return Flight", returnFl, startDate, endDate, startFmt, endFmt);

    body.innerHTML = html;
    wireFlightCardEvents();
  }

    if (flight) {
      // Show saved flight info
      const depTime = flight.departure_time ? formatFlightTime(flight.departure_time) : "";
      const arrTime = flight.arrival_time ? formatFlightTime(flight.arrival_time) : "";
      return `
        <div style="margin-bottom:1rem; padding:0.85rem; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);">

              <button class="flight-delete-btn" data-id="${flight.id}" style="font-size:0.7rem; padding:0.2rem 0.5rem; border-radius:8px; border:1px solid rgba(239,68,68,0.3); background:rgba(239,68,68,0.1); color:#ef4444; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700;">Remove</button>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <div style="flex:1;">
              <div style="font-family:'Mouse Memoirs',sans-serif; font-size:1.3rem; color:white; line-height:1.1;">
                ${escapeHtml(flight.airline || "")} ${escapeHtml(flight.flight_number || "")}
              </div>
              <div style="font-size:0.82rem; color:rgba(255,255,255,0.6); margin-top:0.2rem;">
                ${flight.departure_airport || "?"} → ${flight.arrival_airport || "?"} ${depTime && arrTime ? `· ${depTime} – ${arrTime}` : ""}
              </div>
              ${flight.seat ? `<div style="font-size:0.75rem; color:rgba(255,255,255,0.45); margin-top:0.15rem;">Seat ${escapeHtml(flight.seat)}</div>` : ""}
            </div>
            ${flight.confirmation ? `
              <div style="text-align:right;">
                <div style="font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.4);">Confirmation</div>

              </div>
            ` : ""}
          </div>
          ${flight.notes ? `<div style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:0.4rem; font-style:italic;">${escapeHtml(flight.notes)}</div>` : ""}
        </div>
      `;
    }

    // No flight saved — show search link + "I have my tickets" button
    const isReturn = direction === "return";
    const searchUrl = buildFlightUrl("", "MCO", startDate, endDate, "1", isReturn);
    const dateLine = isReturn ? `${endFmt} → home` : `${startFmt} → ${endFmt}`;

    return `
      <div style="margin-bottom:1rem;">
        <div style="font-size:0.78rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.5); margin-bottom:0.4rem;">${dirEmoji} ${label}</div>
        <a href="${searchUrl}" target="_blank" rel="noopener"
           style="display:flex; align-items:center; justify-content:space-between; padding:0.55rem 0.9rem; border-radius:12px; background:${isReturn ? "rgba(255,255,255,0.08)" : "linear-gradient(135deg, var(--castle-blue), #1e40af)"}; border:1px solid ${isReturn ? "rgba(255,255,255,0.15)" : "transparent"}; color:${isReturn ? "rgba(255,255,255,0.85)" : "white"}; text-decoration:none; font-family:'Nunito',sans-serif; font-size:0.85rem; font-weight:800; margin-bottom:0.4rem;">
          <span>🔍 Search Google Flights</span>
          <span style="font-size:0.72rem; opacity:0.7;">${dateLine}</span>
        </a>
        <button class="flight-add-btn" data-direction="${direction}"

        </button>
      </div>
    `;
  }

  function formatFlightTime(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${ampm}`;
  }

  function wireFlightCardEvents() {
    // "I already have my tickets" buttons
    document.querySelectorAll(".flight-add-btn").forEach(btn => {
      btn.addEventListener("click", () => openFlightForm(btn.dataset.direction));
    });
    // Edit buttons
    document.querySelectorAll(".flight-edit-btn").forEach(btn => {
      btn.addEventListener("click", () => openFlightForm(btn.dataset.direction, btn.dataset.id));
    });
    // Delete buttons
    document.querySelectorAll(".flight-delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        await apiFetch(`/flights/${btn.dataset.id}`, { method: "DELETE" });
        loadFlightCard();
      });
    });
  }

            <div>
              <label style="font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">To</label>
              <input type="text" id="ff-arr-airport" value="${escapeHtml(e.arrival_airport || "")}" placeholder="${direction === "outbound" ? "MCO" : "e.g. CVG"}" maxlength="4" style="width:100%;padding:0.45rem 0.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;text-transform:uppercase;" />
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;">
            <div>
              <label style="font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">Departs</label>
              <input type="time" id="ff-dep-time" value="${e.departure_time || ""}" style="width:100%;padding:0.45rem 0.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;" />
            </div>
            <div>
              <label style="font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">Arrives</label>
              <input type="time" id="ff-arr-time" value="${e.arrival_time || ""}" style="width:100%;padding:0.45rem 0.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;" />
            </div>
            <div>
              <label style="font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">Seat</label>
              <input type="text" id="ff-seat" value="${escapeHtml(e.seat || "")}" placeholder="e.g. 14A" maxlength="5" style="width:100%;padding:0.45rem 0.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;text-transform:uppercase;" />
            </div>
          </div>
          <div>
            <label style="font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">Notes</label>
            <input type="text" id="ff-notes" value="${escapeHtml(e.notes || "")}" placeholder="Terminal, layover, etc." style="width:100%;padding:0.45rem 0.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;" />
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
            <button type="button" id="flight-form-cancel" style="flex:1;padding:0.55rem;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.7);font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;">Cancel</button>
            <button type="submit" style="flex:1;padding:0.55rem;border-radius:10px;border:none;background:var(--pixie-gold);color:var(--castle-blue);font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:800;cursor:pointer;">${editId ? "Update" : "Save"} Flight</button>
          </div>
        </form>
      </div>
    `;

    document.body.appendChild(overlay);

    const closeForm = () => overlay.remove();
    document.getElementById("flight-form-close").addEventListener("click", closeForm);
    document.getElementById("flight-form-cancel").addEventListener("click", closeForm);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeForm(); });

    document.getElementById("flight-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const data = {
        direction,
        airline: document.getElementById("ff-airline").value.trim(),
        flight_number: document.getElementById("ff-number").value.trim(),
        confirmation: document.getElementById("ff-confirmation").value.trim().toUpperCase(),
        departure_airport: document.getElementById("ff-dep-airport").value.trim().toUpperCase(),
        arrival_airport: document.getElementById("ff-arr-airport").value.trim().toUpperCase(),
        departure_time: document.getElementById("ff-dep-time").value,
        arrival_time: document.getElementById("ff-arr-time").value,
        seat: document.getElementById("ff-seat").value.trim().toUpperCase(),
        notes: document.getElementById("ff-notes").value.trim(),
      };

      try {
        if (editId) {
          await apiFetch(`/flights/${editId}`, { method: "PUT", body: JSON.stringify(data) });
        } else {
          await apiFetch(`/trips/${_pretripTripId}/flights`, { method: "POST", body: JSON.stringify(data) });
        }
        closeForm();
        loadFlightCard();
      } catch (e) {
        alert("Failed to save flight details. Try again.");
      }
    });
  }

  // ── Packing List ────────────────────────────────────────────
  async function loadPackingList() {
    if (!_pretripTripId) return;
    const listEl = document.getElementById("packing-list-content");
    if (!listEl) return;

    let items = [];
    try { items = await apiFetch(`/trips/${_pretripTripId}/packing`); } catch (e) { }

    if (items.length === 0) {
      listEl.innerHTML = `<p style="color:rgba(255,255,255,0.35); font-size:0.82rem; font-style:italic; margin:0 0 0.5rem;">No items yet — add something below!</p>`;
      return;
    }

    const checkedCount = items.filter(i => i.checked).length;
    const pct = Math.round((checkedCount / items.length) * 100);

    listEl.innerHTML = `
      <div style="height:4px; background:rgba(255,255,255,0.1); border-radius:999px; margin-bottom:0.75rem; overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:var(--pixie-gold); border-radius:999px; transition:width 0.4s ease;"></div>
      </div>
      <p style="font-size:0.72rem; font-weight:700; color:rgba(255,255,255,0.4); margin:0 0 0.6rem; text-transform:uppercase; letter-spacing:0.06em;">${checkedCount} / ${items.length} packed</p>
      <div style="display:flex; flex-direction:column; gap:0.3rem; max-height:200px; overflow-y:auto;">
        ${items.map(item => `
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="pack-${item.id}" ${item.checked ? "checked" : ""}
              onchange="togglePackingItem('${item.id}', this.checked)"
              style="width:16px; height:16px; accent-color:var(--pixie-gold); cursor:pointer; flex-shrink:0;" />
            <label for="pack-${item.id}" style="flex:1; font-size:0.85rem; font-weight:600; color:${item.checked ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.85)"}; text-decoration:${item.checked ? "line-through" : "none"}; cursor:pointer;">${escapeHtml(item.label)}</label>
            <button onclick="deletePackingItem('${item.id}')" style="background:none; border:none; color:rgba(255,255,255,0.2); cursor:pointer; font-size:0.75rem; padding:2px 4px; border-radius:4px; line-height:1;" title="Remove">✕</button>
          </div>
        `).join("")}
      </div>
    `;
  }

  async function addPackingItem() {
    if (!_pretripTripId) return;
    const input = document.getElementById("packing-new-item");
    const label = input?.value.trim();
    if (!label) return;
    try {
      await apiFetch(`/trips/${_pretripTripId}/packing`, {
        method: "POST",
        body: JSON.stringify({ label }),
      });
      input.value = "";
      loadPackingList();
    } catch (e) { showToast("❌ Could not add item."); }
  }

  async function togglePackingItem(id, checked) {
    try {
      await apiFetch(`/packing/${id}`, {
        method: "PATCH",
        body: JSON.stringify({ checked }),
      });
      loadPackingList();
    } catch (e) { }
  }

  async function deletePackingItem(id) {
    try {
      await apiFetch(`/packing/${id}`, { method: "DELETE" });
      loadPackingList();
    } catch (e) { }
  }

  // Allow pressing Enter to add packing item
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.activeElement?.id === "packing-new-item") {
      addPackingItem();
    }
  });

  // Store trip ID globally for contribution functions
  let _pretripTripId = null;

  async function addContribution() {
    const amountInput = document.getElementById("contrib-amount");
    const noteInput = document.getElementById("contrib-note");
    const amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) { amountInput.focus(); return; }

    const user = Auth.getUser();

    // Determine trip ID from the page
    if (!_pretripTripId) return;

    try {
      await apiFetch(`/trips/${_pretripTripId}/contributions`, {
        method: "POST",
        body: JSON.stringify({
          amount,
          note: noteInput.value.trim(),
          contributed_by: user ? user.id : "",
          contributed_by_name: user ? user.name : "Guest",
          date: new Date().toISOString().split("T")[0],
        }),
      });
      showToast(`✅ Added ${formatMoney(amount)} to trip fund!`);
      loadPretrip(); // Refresh
    } catch (err) {
      console.error("Contribution failed:", err);
      showToast("❌ Failed to add contribution.");
    }
  }

  async function deleteContribution(id) {
    try {
      await apiFetch(`/contributions/${id}`, { method: "DELETE" });
      showToast("🗑️ Contribution removed.");
      loadPretrip();
    } catch (err) {
      showToast("❌ Failed to remove contribution.");
    }
  }

  async function logSteps() {
    const input = document.getElementById("steps-input");
    const val = parseInt(input.value, 10);
    if (!Number.isFinite(val) || val < 0) { input.focus(); return; }
    if (!_pretripTripId) return;
    const user = Auth.getUser();
    if (!user) { showToast("❌ Please log in first."); return; }
    try {
      await apiFetch(`/trips/${_pretripTripId}/steps`, {
        method: "POST",
        body: JSON.stringify({
          user_id: user.id,
          date: new Date().toISOString().split("T")[0],
          steps: val,
        }),
      });
      showToast(`👟 Logged ${val.toLocaleString()} steps!`);
      loadPretrip();
    } catch (err) {
      console.error("Step log failed:", err);
      showToast("❌ Failed to log steps.");
    }
  }

  // Wrap initApp to also run loadPretrip
  const _origInitApp = window.initApp || initApp;
  initApp = function() {
    _origInitApp();
    getStoredItinerary().then(async () => {
      // Determine the next trip ID from trip_budgets
      const todayStr = getTodayString();
      try {
        const allTrips = await apiFetch("/trip-budgets");
        const upcoming = allTrips
          .filter(t => t.start_date > todayStr)
          .sort((a, b) => a.start_date.localeCompare(b.start_date));
        if (upcoming.length > 0) {
          _pretripTripId = upcoming[0].trip_id;
        }
      } catch (e) { }
      loadPretrip();
    });
  };
  </script>

  <!-- Weather Forecast Modal -->
  <div id="weather-modal-overlay" class="hidden" role="dialog" aria-modal="true">
    <div class="weather-modal-card">
      <button class="weather-modal-close" id="weather-modal-close" aria-label="Close">✕</button>
      <div id="weather-modal-content">
        <div class="weather-loading">🌤️ Fetching forecast...</div>
      </div>
    </div>
  </div>

  <!-- Backdrop overlay -->
  <div class="nav-overlay hidden" id="nav-overlay"></div>
</body>
</html>
