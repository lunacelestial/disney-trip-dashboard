<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disney — Trip Calendar</title>
  <link rel="stylesheet" href="assets/css/base.css?v=16" />
  <link rel="stylesheet" href="assets/css/header.css?v=16" />
  <link rel="stylesheet" href="assets/css/nav.css?v=16" />
  <link rel="stylesheet" href="assets/css/cards.css?v=16" />
  <link rel="stylesheet" href="assets/css/eticket.css?v=16" />
  <link rel="stylesheet" href="assets/css/modals.css?v=16" />
  <link rel="stylesheet" href="assets/css/budget.css?v=16" />
  <link rel="stylesheet" href="assets/css/wizard.css?v=16" />
  <link rel="stylesheet" href="assets/css/venues.css?v=16" />
  <style>
    /* ── Trip Calendar Styles ─────────────────────────── */
    .cal-trip-pill { margin-bottom: 1.5rem; }

    /* Jump to Today button — sticky, only shown during active trip */
    .cal-jump-today {
      position: fixed;
      bottom: 1.5rem;
      right: 1.25rem;
      z-index: 500;
      background: var(--pixie-gold);
      color: var(--castle-blue);
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 193, 37, 0.5);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.25s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .cal-jump-today:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 193, 37, 0.6);
    }
    .cal-jump-today.hidden { opacity: 0; pointer-events: none; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .cal-day {
      background: rgba(255, 253, 244, 0.92);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      overflow: hidden;
      transition: transform 0.15s;
    }
    .cal-day:hover { transform: translateY(-2px); }
    .cal-day.is-today { border-color: var(--pixie-gold); box-shadow: 0 0 0 2px rgba(255,193,37,0.3), var(--card-shadow); }
    .cal-day.is-past { opacity: 0.6; }

    .cal-day-header {
      padding: 0.75rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1.5px solid rgba(0,0,0,0.05);
    }
    .cal-day-name {
      font-family: 'Mouse Memoirs', sans-serif;
      font-size: 1.2rem; color: var(--castle-blue);
      letter-spacing: 0.02em;
    }
    .cal-day-date {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
    }
    .cal-day-today-badge {
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      background: var(--pixie-gold); color: #1a1a2e;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      letter-spacing: 0.06em;
    }

    .cal-park-banner {
      padding: 0.5rem 1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem; font-weight: 800;
      display: flex; align-items: center; gap: 0.4rem;
    }

    .cal-day-body {
      padding: 0.75rem 1rem 1rem;
      display: flex; flex-direction: column; gap: 0.4rem;
      min-height: 60px;
    }

    .cal-event {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      font-family: 'Nunito', sans-serif;
    }
    .cal-event:last-child { border-bottom: none; }
    .cal-event-icon { font-size: 1rem; flex-shrink: 0; }
    .cal-event-info { flex: 1; min-width: 0; }
    .cal-event-title {
      font-size: 0.85rem; font-weight: 700; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cal-event-time {
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
    }

    .cal-empty-day {
      color: var(--muted); font-style: italic;
      font-size: 0.85rem; padding: 0.5rem 0;
    }

    .cal-legend {
      display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem;
      padding: 1rem; background: rgba(255,253,244,0.7); border-radius: 12px;
      justify-content: center;
    }
    .cal-legend-item {
      display: flex; align-items: center; gap: 0.3rem;
      font-family: 'Nunito', sans-serif; font-size: 0.75rem;
      font-weight: 700; color: var(--slate);
    }

    @media (max-width: 640px) {
      .cal-grid { grid-template-columns: 1fr; }
    }

    /* Day detail modal — activity list items */
    .cal-modal-activity {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.6rem 0.7rem;
      border-radius: 10px;
      background: rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.05);
      transition: background 0.1s;
    }
    .cal-modal-activity:hover {
      background: rgba(0,0,0,0.04);
    }
    .cal-modal-act-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .cal-modal-delete-btn {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(239,68,68,0.08);
      color: #ef4444;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      margin-top: 0.1rem;
    }
    .cal-modal-activity:hover .cal-modal-delete-btn {
      opacity: 1;
    }
    .cal-modal-delete-btn:hover {
      background: rgba(239,68,68,0.18);
    }
  </style>
</head>
<body class="page-tripcalendar">
  <div class="utility-bar">
    <div class="utility-bar-inner">
      <div id="utility-user-slot"></div>
      <div id="weather-badge" class="utility-weather" aria-label="Weather" role="button" tabindex="0">
        <span class="weather-badge-icon" id="weather-badge-icon">🌤️</span>
        <div class="weather-badge-text">
          <span class="weather-badge-temp" id="weather-badge-temp">--°F</span>
          <span class="weather-badge-desc" id="weather-badge-desc">Loading...</span>
        </div>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container">
      <div class="park-entrance">
        <img src="assets/images/mickey-mouse-pose1.png" class="character-img mickey" alt="Mickey Mouse" />
        <div class="entrance-sign">
          <div class="entrance-arch">
            <span class="entrance-eyebrow">Walt Disney World</span>
            <h1 class="entrance-title">Trip Calendar</h1>
            <span class="entrance-subtitle">✨ Your Week at a Glance ✨</span>
          </div>
        </div>
        <img src="assets/images/minnie-mouse-pose1.png" class="character-img minnie" alt="Minnie Mouse" />
      </div>

      <div class="nav-pill" id="nav-pill" role="button" tabindex="0" aria-label="Toggle navigation menu">
        <div class="nav-pill-hamburger"><span></span><span></span><span></span></div>
        <span class="nav-pill-label">Calendar</span>
      </div>
      <!-- E-Ticket Nav Tray — populated by renderNav() in header.js -->
      <div class="nav-ticket-tray" id="nav-ticket-tray">
        <div class="nav-ticket-scroll hide-scrollbar"></div>
      </div>

      <div class="budget-pill" id="budget-pill" role="button" tabindex="0" aria-label="Quick add expense">
        <span class="budget-pill-icon">💰</span>
        <span class="budget-pill-amount" id="budget-pill-amount">Loading...</span>
        <span class="budget-pill-label">remaining</span>
        <span class="budget-pill-tap-hint">tap to add</span>
      </div>

      <div id="park-day-bar" class="park-day-bar">
        <span class="park-day-bar-label" id="park-day-label">PARK DAY</span>
        <span class="park-day-bar-title" id="park-day-title"></span>
        <span class="park-day-bar-hours" id="park-day-hours"></span>
      </div>
    </div>
  </header>

  <main class="container page-content">
    <div id="cal-app">
      <p style="text-align:center; color:var(--muted);">Loading calendar...</p>
    </div>
  </main>

  <script src="assets/js/script.js?v=17"></script>
  <script src="assets/js/header.js?v=16"></script>
  <script src="assets/js/budget.js?v=16"></script>
  <script>
  // ============================================================
  // TRIP CALENDAR — Week-at-a-glance view
  // ============================================================

  const CAL_PARK_INFO = {
    "magic-kingdom":     { emoji: "🏰", label: "Magic Kingdom",     color: "#1e40af", bg: "rgba(30,64,175,0.08)" },
    "epcot":             { emoji: "🌍", label: "EPCOT",             color: "#7c3aed", bg: "rgba(124,58,237,0.08)" },
    "hollywood-studios": { emoji: "🎬", label: "Hollywood Studios", color: "#b91c1c", bg: "rgba(185,28,28,0.08)" },
    "animal-kingdom":    { emoji: "🌿", label: "Animal Kingdom",    color: "#15803d", bg: "rgba(21,128,61,0.08)" },
    "disney-springs":    { emoji: "🛍️", label: "Disney Springs",    color: "#0369a1", bg: "rgba(3,105,161,0.08)" },
    "rest-day":          { emoji: "☀️", label: "Rest / Pool Day",   color: "#ca8a04", bg: "rgba(202,138,4,0.08)" },
    "travel":            { emoji: "🚗", label: "Travel Day",        color: "#475569", bg: "rgba(71,85,105,0.08)" },
  };

  const CAL_TYPE_ICONS = {
    ride: "🎢", dining: "🍽️", show: "🎭", merch: "🛍️",
    shopping: "🛍️", travel: "🚗", break: "☀️", "lightning lane": "⚡",
  };

  async function loadCalendar() {
    const app = document.getElementById("cal-app");

    // Get trip from URL param, or auto-detect
    const urlParams = new URLSearchParams(window.location.search);
    let tripId = urlParams.get("trip");

    // Load trips
    let allTrips = [];
    try { allTrips = await apiFetch("/trip-budgets"); } catch (e) { }

    // Sort: active trip first, then upcoming (chronological), then past (reverse chronological)
    const sortToday = new Date().toISOString().split("T")[0];
    allTrips.sort((a, b) => {
      const score = t => (sortToday >= t.start_date && sortToday <= t.end_date) ? 0 : t.start_date > sortToday ? 1 : 2;
      const sa = score(a), sb = score(b);
      if (sa !== sb) return sa - sb;
      return sa === 1 ? a.start_date.localeCompare(b.start_date) : b.start_date.localeCompare(a.start_date);
    });

    if (allTrips.length === 0) {
      app.innerHTML = `
        <div style="text-align:center; padding:3rem 1.5rem;">
          <div style="font-size:3rem; margin-bottom:0.75rem;">🗺️</div>
          <h3 style="font-family:'Mouse Memoirs',sans-serif; font-size:1.5rem; color:var(--castle-blue);">No Trips Yet</h3>
          <p style="color:var(--slate);">Create a trip in the Planner to see your calendar here.</p>
          <a href="planner.html" class="primary-button" style="display:inline-block; margin-top:1rem; text-decoration:none;">Plan a Trip ✨</a>
        </div>
      `;
      return;
    }

    // If no trip specified, pick the current/upcoming one
    if (!tripId) {
      const today = new Date().toISOString().split("T")[0];
      const trip = allTrips.find(t => today >= t.start_date && today <= t.end_date)
        || allTrips.find(t => t.start_date > today)
        || allTrips[0];
      tripId = trip?.trip_id;
    }

    const selectedTrip = allTrips.find(t => t.trip_id === tripId) || allTrips[0];
    if (!selectedTrip) return;

    // Trip selector
    const today = new Date().toISOString().split("T")[0];
    const tripOptions = allTrips.map(t => {
      const tag = today >= t.start_date && today <= t.end_date ? " 🌟 Now" :
                  t.start_date > today ? " 🗓️ Upcoming" : " ✅ Past";
      return `<option value="${t.trip_id}" ${t.trip_id === selectedTrip.trip_id ? "selected" : ""}>${t.label}${tag}</option>`;
    }).join("");

    // Load activities and park days
    const allActivities = sortItineraryByTime(await getStoredItinerary());
    const allParkDays = await ParkDaysDB.getAll();

    // Build date range
    const [sy, sm, sd] = selectedTrip.start_date.split("-").map(Number);
    const [ey, em, ed] = selectedTrip.end_date.split("-").map(Number);
    const startDate = new Date(sy, sm - 1, sd);
    const endDate = new Date(ey, em - 1, ed);

    const dates = [];
    const cursor = new Date(startDate);
    while (cursor <= endDate) {
      dates.push(cursor.toISOString().split("T")[0]);
      cursor.setDate(cursor.getDate() + 1);
    }

    // Group activities by date
    const actsByDate = {};
    allActivities.forEach(a => {
      if (a.date >= selectedTrip.start_date && a.date <= selectedTrip.end_date) {
        if (!actsByDate[a.date]) actsByDate[a.date] = [];
        actsByDate[a.date].push(a);
      }
    });

    // Park days map
    const parkMap = {};
    allParkDays.forEach(pd => { parkMap[pd.date] = pd.park; });

    // Build grid HTML
    const todayStr = getTodayString();

    let gridHtml = dates.map((date, i) => {
      const [dy, dm, dd] = date.split("-").map(Number);
      const dateObj = new Date(dy, dm - 1, dd);
      const dayName = dateObj.toLocaleDateString("en-US", { weekday: "long" });
      const dateLabel = dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      const isToday = date === todayStr;
      const isPast = date < todayStr;
      const dayNum = i + 1;

      const park = parkMap[date];
      const parkInfo = park ? CAL_PARK_INFO[park] : null;
      const activities = (actsByDate[date] || []).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

      // Filter to key events: dining + travel + shows (skip individual rides to keep it clean)
      const keyEvents = activities.filter(a => {
        const t = (a.type || "").toLowerCase();
        return t === "dining" || t === "travel" || t === "show";
      });

      // Also show rides but only count
      const rideCount = activities.filter(a => (a.type || "").toLowerCase() === "ride").length;

      let parkBannerHtml = "";
      if (parkInfo) {
        parkBannerHtml = `
          <div class="cal-park-banner" style="color:${parkInfo.color}; background:${parkInfo.bg};">
            ${parkInfo.emoji} ${parkInfo.label}
          </div>
        `;
      }

      let eventsHtml = "";
      if (keyEvents.length > 0) {
        eventsHtml = keyEvents.map(a => {
          const type = (a.type || "").toLowerCase();
          const icon = CAL_TYPE_ICONS[type] || "📌";
          return `
            <div class="cal-event">
              <span class="cal-event-icon">${icon}</span>
              <div class="cal-event-info">
                <div class="cal-event-title">${escapeHtml(a.title)}</div>
                <div class="cal-event-time">${formatTimeForDisplay(a.time)}${a.location ? " · " + escapeHtml(a.location) : ""}</div>
              </div>
            </div>
          `;
        }).join("");
      }

      if (rideCount > 0) {
        eventsHtml += `
          <div class="cal-event">
            <span class="cal-event-icon">🎢</span>
            <div class="cal-event-info">
              <div class="cal-event-title">${rideCount} ride${rideCount !== 1 ? "s" : ""} planned</div>
            </div>
          </div>
        `;
      }

      if (!eventsHtml && !parkBannerHtml) {
        eventsHtml = `<p class="cal-empty-day">No plans yet</p>`;
      }

      return `
        <div class="cal-day${isToday ? " is-today" : ""}${isPast ? " is-past" : ""}" data-date="${date}" role="button" tabindex="0" style="cursor:pointer;">
          <div class="cal-day-header">
            <div>
              <span class="cal-day-name">${dayName}</span>
              <span class="cal-day-date">Day ${dayNum} · ${dateLabel}</span>
            </div>
            ${isToday ? '<span class="cal-day-today-badge">Today</span>' : ''}
          </div>
          ${parkBannerHtml}
          <div class="cal-day-body">
            ${eventsHtml}
          </div>
        </div>
      `;
    }).join("");

    app.innerHTML = `
      <div class="cal-trip-pill">
        <div class="budget-trip-pill">
          <label class="card-label">Trip Calendar For</label>
          <select id="cal-trip-select">${tripOptions}</select>
        </div>
      </div>

      <div class="cal-grid">
        ${gridHtml}
      </div>

      <div class="cal-legend">
        <span class="cal-legend-item">🍽️ Dining</span>
        <span class="cal-legend-item">🎭 Show</span>
        <span class="cal-legend-item">🎢 Rides</span>
        <span class="cal-legend-item">🚗 Travel</span>
      </div>

      <div style="text-align:center; margin-top:1.5rem;">
        <a href="itinerary.html" class="secondary-button" style="display:inline-block; text-decoration:none;">
          View Full Itinerary →
        </a>
      </div>
    `;

    // Jump to Today button — only show if today is in this trip's date range
    let jumpBtn = document.getElementById("cal-jump-today-btn");
    if (!jumpBtn) {
      jumpBtn = document.createElement("button");
      jumpBtn.id = "cal-jump-today-btn";
      jumpBtn.className = "cal-jump-today";
      jumpBtn.innerHTML = `📍 Today`;
      document.body.appendChild(jumpBtn);
    }

    const todayInTrip = todayStr >= selectedTrip.start_date && todayStr <= selectedTrip.end_date;
    jumpBtn.classList.toggle("hidden", !todayInTrip);

    jumpBtn.onclick = () => {
      const todayCard = app.querySelector(".cal-day.is-today");
      if (todayCard) {
        todayCard.scrollIntoView({ behavior: "smooth", block: "center" });
        todayCard.style.boxShadow = "0 0 0 4px rgba(255,193,37,0.7), var(--card-shadow)";
        setTimeout(() => { todayCard.style.boxShadow = ""; }, 1200);
      }
    };

    // Wire trip selector
    document.getElementById("cal-trip-select")?.addEventListener("change", (e) => {
      const newTripId = e.target.value;
      window.history.replaceState({}, "", `tripcalendar.html?trip=${encodeURIComponent(newTripId)}`);
      loadCalendar();
    });

    // Wire day cards to open detail modal
    app.querySelectorAll(".cal-day[data-date]").forEach(card => {
      card.addEventListener("click", () => {
        const date = card.dataset.date;
        const activities = actsByDate[date] || [];
        const park = parkMap[date];
        openCalDayModal(date, activities, park);
      });
    });
  }

  // ── Day Detail Modal ────────────────────────────────────────

  function openCalDayModal(date, activities, parkSlug) {
    // Remove any existing modal
    document.getElementById("cal-day-modal-overlay")?.remove();

    const [y, m, d] = date.split("-").map(Number);
    const dateObj = new Date(y, m - 1, d);
    const dayLabel = dateObj.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const parkInfo = parkSlug ? CAL_PARK_INFO[parkSlug] : null;

    const sorted = [...activities].sort((a, b) => (a.time || "").localeCompare(b.time || ""));

    let listHtml = "";
    if (sorted.length === 0) {
      listHtml = `<p style="text-align:center; color:var(--muted); padding:1.5rem 0; font-style:italic;">No activities planned yet.</p>`;
    } else {
      listHtml = sorted.map(a => {
        const type = (a.type || "").toLowerCase();
        const icon = CAL_TYPE_ICONS[type] || "📌";
        return `
          <div class="cal-modal-activity" data-id="${a.id}">
            <span class="cal-modal-act-icon">${icon}</span>
            <div style="flex:1; min-width:0;">
              <div style="font-family:'Nunito',sans-serif; font-size:0.92rem; font-weight:700; color:var(--ink);">${escapeHtml(a.title)}</div>
              <div style="font-family:'Nunito',sans-serif; font-size:0.78rem; color:var(--muted);">
                ${formatTimeForDisplay(a.time)}${a.location ? " · " + escapeHtml(a.location) : ""}${a.type ? " · " + escapeHtml(a.type) : ""}
              </div>
              ${a.notes ? `<div style="font-family:'Nunito',sans-serif; font-size:0.72rem; color:var(--slate); margin-top:0.15rem; font-style:italic;">${escapeHtml(a.notes)}</div>` : ""}
            </div>
            <button class="cal-modal-delete-btn" data-id="${a.id}" title="Delete activity">✕</button>
          </div>
        `;
      }).join("");
    }

    const overlay = document.createElement("div");
    overlay.id = "cal-day-modal-overlay";
    overlay.className = "modal-overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.innerHTML = `
      <div class="modal-card" style="max-width:500px; width:95vw;">
        <button class="modal-close-btn" id="cal-day-modal-close" aria-label="Close">✕</button>
        <div class="modal-header">
          <p class="card-label">${parkInfo ? parkInfo.emoji + " " + parkInfo.label : "📅 Day Plan"}</p>
          <h2>${dayLabel}</h2>
          <p class="modal-meta">${sorted.length} activit${sorted.length === 1 ? "y" : "ies"} planned</p>
        </div>

        <div id="cal-day-modal-list" style="padding:0 1.75rem; display:flex; flex-direction:column; gap:0.4rem;">
          ${listHtml}
        </div>

        <div style="padding:0 1.75rem 0.75rem; margin-top:1rem; border-top:1.5px solid rgba(0,0,0,0.06); padding-top:1rem;">
          <button type="button" id="cal-add-toggle-btn" class="primary-button" style="width:100%; font-size:0.88rem; padding:0.55rem 1rem;">+ Add Activity</button>
          <form id="cal-day-add-form" style="display:none; flex-direction:column; gap:0.5rem; margin-top:0.75rem;">
            <div style="display:flex; gap:0.5rem;">
              <input type="time" id="cal-add-time" required style="flex:1; padding:0.5rem 0.6rem; border:1.5px solid #d1d5db; border-radius:10px; font-family:'Nunito',sans-serif; font-size:0.88rem;" />
              <select id="cal-add-type" required style="flex:1; padding:0.5rem 0.6rem; border:1.5px solid #d1d5db; border-radius:10px; font-family:'Nunito',sans-serif; font-size:0.88rem;">
                <option value="Break">Break</option>
                <option value="Dining">Dining</option>
                <option value="Lightning Lane">Lightning Lane</option>
                <option value="Ride" selected>Ride</option>
                <option value="Merch">Shopping</option>
                <option value="Show">Show</option>
                <option value="Travel">Travel</option>
              </select>
            </div>
            <input type="text" id="cal-add-title" placeholder="Activity name" required style="padding:0.5rem 0.6rem; border:1.5px solid #d1d5db; border-radius:10px; font-family:'Nunito',sans-serif; font-size:0.88rem;" />
            <input type="text" id="cal-add-location" placeholder="Location (e.g. Fantasyland)" required style="padding:0.5rem 0.6rem; border:1.5px solid #d1d5db; border-radius:10px; font-family:'Nunito',sans-serif; font-size:0.88rem;" />
            <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
              <button type="button" id="cal-add-cancel-btn" class="secondary-button" style="font-size:0.82rem; padding:0.45rem 0.9rem;">Cancel</button>
              <button type="submit" class="primary-button" style="font-size:0.88rem; padding:0.55rem 1rem;">Save</button>
            </div>
          </form>
        </div>

        <div style="padding:0.75rem 1.75rem 1.5rem; text-align:center;">
          <a href="itinerary.html" class="secondary-button" style="text-decoration:none; font-size:0.82rem; display:inline-block;">View Full Itinerary</a>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Close handlers
    document.getElementById("cal-day-modal-close").addEventListener("click", closeCalDayModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCalDayModal(); });
    document.addEventListener("keydown", function _esc(e) {
      if (e.key === "Escape") { closeCalDayModal(); document.removeEventListener("keydown", _esc); }
    });

    // Delete activity buttons
    overlay.querySelectorAll(".cal-modal-delete-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        await ItineraryDB.delete(id);
        closeCalDayModal();
        await loadCalendar();
        showToast("Activity removed");
      });
    });

    // Toggle add-activity form
    const addToggle = document.getElementById("cal-add-toggle-btn");
    const addForm = document.getElementById("cal-day-add-form");
    const addCancel = document.getElementById("cal-add-cancel-btn");

    addToggle.addEventListener("click", () => {
      addToggle.style.display = "none";
      addForm.style.display = "flex";
      document.getElementById("cal-add-time").focus();
    });
    addCancel.addEventListener("click", () => {
      addForm.style.display = "none";
      addToggle.style.display = "";
      addForm.reset();
    });

    // Add activity form
    document.getElementById("cal-day-add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newActivity = {
        id: "act-" + Date.now(),
        date: date,
        time: document.getElementById("cal-add-time").value,
        type: document.getElementById("cal-add-type").value,
        title: document.getElementById("cal-add-title").value.trim(),
        location: document.getElementById("cal-add-location").value.trim(),
        notes: "",
        image: "",
        url: "",
      };
      await ItineraryDB.add(newActivity);
      closeCalDayModal();
      await loadCalendar();
      showToast("Activity added!");
    });
  }

  function closeCalDayModal() {
    const overlay = document.getElementById("cal-day-modal-overlay");
    if (overlay) overlay.remove();
  }

  // Hook into initApp
  const _origInitApp = window.initApp || initApp;
  initApp = function() {
    _origInitApp();
    getStoredItinerary().then(() => loadCalendar());
  };
  </script>

  <!-- Weather Forecast Modal -->
  <div id="weather-modal-overlay" class="hidden" role="dialog" aria-modal="true">
    <div class="weather-modal-card">
      <button class="weather-modal-close" id="weather-modal-close" aria-label="Close">✕</button>
      <div id="weather-modal-content">
        <div class="weather-loading">🌤️ Fetching forecast...</div>
      </div>
    </div>

  <div class="budget-quick-add" id="budget-quick-add">

        <input type="number" id="bqa-amount" placeholder="Cost ($)" step="0.01" min="0.01" required />

          <option value="Food">Dining 🍔</option>
          <option value="Merch">Souvenirs 🛍️</option>

          <option value="Extras">Enchanting Extras ✨</option>
          <option value="Tickets">Tickets/Genie+ 🎟️</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <input type="date" id="bqa-date" value="" style="width:100%;padding:0.65rem 0.9rem;border:1.5px solid #d1d5db;border-radius:10px;font-family:Nunito,sans-serif;font-size:0.95rem;color:#1a1a2e;background:#fff;" />
      <button type="submit" class="budget-quick-add-btn">Add Expense ✨</button>
      <a href="budget.html" class="budget-quick-add-link">View Full Budget →</a>
    </form>
  </div>

  <div class="nav-overlay hidden" id="nav-overlay"></div>
